name: Extract Codebase ZIP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/extract-codebase.yml
      - marlene-codebase-safe.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP and commit files
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="marlene-codebase-safe.zip"
          WORKFLOW_FILE=".github/workflows/extract-codebase.yml"
          TEMP_DIR=".extract-codebase-tmp"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found. Nothing to extract."
            exit 0
          fi

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"
          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          shopt -s dotglob nullglob
          for item in "$TEMP_DIR"/*; do
            cp -a "$item" .
          done

          rm -rf "$TEMP_DIR"
          rm -f "$ZIP_FILE"
          rm -f "$WORKFLOW_FILE"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Extract Marlene Brits codebase"
          git push origin main
