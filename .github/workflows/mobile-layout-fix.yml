name: Mobile layout and performance fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile-layout-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive layout fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected snippet not found in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new))

          Path('src/components/premium/SmoothScroll.tsx').write_text("""'use client'

          import { useEffect, useRef } from 'react'
          import Lenis from '@studio-freight/lenis'

          const NAV_OFFSET = 88

          function scrollToHash(hash: string, behavior: ScrollBehavior = 'smooth') {
            const id = hash.replace('#', '')
            const el = document.getElementById(id)
            if (!el) return

            const top = el.getBoundingClientRect().top + window.scrollY - NAV_OFFSET
            window.scrollTo({ top: Math.max(0, top), behavior })
          }

          export default function SmoothScroll({ children }: { children: React.ReactNode }) {
            const lenisRef = useRef<Lenis | null>(null)
            const rafIdRef = useRef<number>(0)

            useEffect(() => {
              const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
              const coarsePointer = window.matchMedia('(pointer: coarse)').matches
              const shouldUseNativeScroll = prefersReducedMotion || coarsePointer || window.innerWidth < 1024

              let lenis: Lenis | null = null
              if (!shouldUseNativeScroll) {
                try {
                  lenis = new Lenis({
                    duration: 0.85,
                    easing: (t: number) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                    orientation: 'vertical',
                    gestureOrientation: 'vertical',
                    smoothWheel: true,
                    wheelMultiplier: 0.85,
                    touchMultiplier: 1,
                    infinite: false,
                  })
                  lenisRef.current = lenis
                } catch (e) {
                  console.warn('Lenis smooth scroll initialization failed, falling back to native scroll:', e)
                }
              }

              function raf(time: number) {
                lenis?.raf(time)
                rafIdRef.current = requestAnimationFrame(raf)
              }

              if (lenis) rafIdRef.current = requestAnimationFrame(raf)

              const handleClick = (e: MouseEvent) => {
                const target = e.target as HTMLElement
                const anchor = target.closest('a[href^="#"]') as HTMLAnchorElement | null
                if (!anchor) return

                const hash = anchor.getAttribute('href')
                if (!hash || hash === '#') return

                const el = document.getElementById(hash.slice(1))
                if (!el) return

                e.preventDefault()

                if (lenis) {
                  lenis.scrollTo(el, {
                    offset: -NAV_OFFSET,
                    duration: 0.9,
                    easing: (t: number) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                  })
                } else {
                  scrollToHash(hash)
                }
              }

              document.addEventListener('click', handleClick)

              return () => {
                document.removeEventListener('click', handleClick)
                if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current)
                lenis?.destroy()
                lenisRef.current = null
              }
            }, [])

            return <>{children}</>
          }
          """.replace('          ', ''))

          replace('src/components/premium/Navigation.tsx',
          """      if (el) {
                  el.scrollIntoView({ behavior: 'smooth', block: 'start' })
                }""",
          """      if (el) {
                  const navOffset = 88
                  const top = el.getBoundingClientRect().top + window.scrollY - navOffset
                  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' })
                }""")
          replace('src/components/premium/Navigation.tsx',
          """className={`fixed top-0 left-0 right-0 z-50 transition-all duration-700 ${
                    isScrolled
                      ? 'nav-glass-3d py-0'
                      : 'bg-transparent py-1'
                  }`} """.rstrip(),
          """className={`fixed top-0 left-0 right-0 z-50 w-full transition-all duration-500 ${
                    isScrolled
                      ? 'nav-glass-3d py-0'
                      : 'bg-[rgba(26,26,46,0.94)] py-0 shadow-[0_8px_30px_rgba(0,0,0,0.12)] backdrop-blur-xl lg:bg-transparent lg:py-1 lg:shadow-none lg:backdrop-blur-0'
                  }`} """.rstrip())
          replace('src/components/premium/Navigation.tsx', 'className="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8"', 'className="mx-auto flex h-[74px] max-w-7xl items-center justify-between px-4 sm:h-20 sm:px-6 lg:px-8"')
          replace('src/components/premium/Navigation.tsx', 'className="logo-3d-hover group relative flex flex-col items-start gap-1.5"', 'className="logo-3d-hover group relative flex min-w-0 flex-col items-start gap-1.5"')
          replace('src/components/premium/Navigation.tsx', 'className="font-serif-optical text-[1.3rem] tracking-[0.22em] font-medium text-white transition-colors duration-500"', 'className="font-serif-optical text-[1.05rem] tracking-[0.16em] font-medium text-white transition-colors duration-500 sm:text-[1.3rem] sm:tracking-[0.22em]"')
          replace('src/components/premium/Navigation.tsx', 'className="text-[9px] tracking-[0.4em] font-extralight uppercase text-gold transition-colors duration-500"', 'className="text-[8px] tracking-[0.28em] font-extralight uppercase text-gold transition-colors duration-500 sm:text-[9px] sm:tracking-[0.4em]"')
          replace('src/components/premium/Navigation.tsx', "className={`lg:hidden relative z-[60] p-2 transition-colors duration-300 ${mobileOpen ? 'text-gold' : 'text-white'}`}", "className={`lg:hidden relative z-[60] rounded-full p-2 transition-colors duration-300 ${mobileOpen ? 'text-gold' : 'text-white'}`}")
          replace('src/components/premium/Navigation.tsx', 'className="flex flex-col items-center gap-5"', 'className="flex flex-col items-center gap-4 px-6"')
          replace('src/components/premium/Navigation.tsx', 'className={`group relative text-3xl tracking-[0.2em] uppercase font-extralight transition-all duration-300 ${', 'className={`group relative text-2xl tracking-[0.16em] uppercase font-extralight transition-all duration-300 sm:text-3xl sm:tracking-[0.2em] ${')

          replace('src/components/premium/FloatingCTA.tsx', 'className="fixed bottom-6 right-6 z-40 flex flex-col items-center gap-3 md:flex-col"', 'className="fixed bottom-4 left-1/2 z-40 flex -translate-x-1/2 flex-col items-center gap-3 md:bottom-6 md:left-auto md:right-6 md:translate-x-0 md:flex-col"')
          replace('src/components/premium/FloatingCTA.tsx', 'className="group relative flex items-center gap-2.5 overflow-hidden rounded-full px-6 py-3.5 text-[11px] font-medium uppercase tracking-[0.15em] breathing-glow"', 'className="group relative flex w-[calc(100vw-2rem)] max-w-[340px] items-center justify-center gap-2.5 overflow-hidden rounded-full px-4 py-3 text-[10px] font-medium uppercase tracking-[0.12em] breathing-glow sm:w-auto sm:px-6 sm:py-3.5 sm:text-[11px] sm:tracking-[0.15em]"')
          replace('src/components/premium/FloatingCTA.tsx', "if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })", "if (el) {\n                const top = el.getBoundingClientRect().top + window.scrollY - 88\n                window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' })\n              }")
          replace('src/components/premium/BackToTop.tsx', 'className="group fixed bottom-6 left-6 z-40 flex h-11 w-11 items-center justify-center rounded-full border glass-card-3d"', 'className="group fixed bottom-24 left-4 z-40 flex h-11 w-11 items-center justify-center rounded-full border glass-card-3d md:bottom-6 md:left-6"')

          replace('src/components/sections/TeamSection.tsx', """className={`relative w-full overflow-hidden ${
                  isFounder ? 'aspect-[3/4]' : 'aspect-[3/4]'
                }`} """.rstrip(), """className={`relative w-full overflow-hidden ${
                  isFounder ? 'aspect-[4/3] md:aspect-[3/4]' : 'aspect-[4/3] sm:aspect-[3/4]'
                }`} """.rstrip())
          replace('src/components/sections/TeamSection.tsx', "isFounder ? 'text-6xl md:text-7xl' : 'text-5xl md:text-6xl'", "isFounder ? 'text-5xl md:text-7xl' : 'text-4xl md:text-6xl'")
          replace('src/components/sections/TeamSection.tsx', 'className="relative py-20 md:py-28 bg-[oklch(0.97_0.003_90)]"', 'className="relative scroll-mt-24 py-16 sm:py-20 md:py-28 bg-[oklch(0.97_0.003_90)] overflow-hidden"')
          replace('src/components/sections/TeamSection.tsx', 'className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 max-w-6xl mx-auto"', 'className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10 max-w-6xl mx-auto"')

          replace('src/components/sections/AboutSection.tsx', 'className="relative py-20 sm:py-28 md:py-32 bg-white overflow-hidden"', 'className="relative scroll-mt-24 py-16 sm:py-24 md:py-32 bg-white overflow-hidden"')
          replace('src/components/sections/AboutSection.tsx', 'className="space-y-4 text-muted-foreground leading-relaxed"', 'className="space-y-4 text-[15px] leading-relaxed text-muted-foreground sm:text-base"')

          replace('src/components/sections/HeroSection.tsx', "function GoldParticles() {\n  const rand = mulberry32(42);\n  const particles = Array.from({ length: 60 }, (_, i) => ({", "function GoldParticles() {\n  const [isMobile, setIsMobile] = useState(false);\n\n  useEffect(() => {\n    const media = window.matchMedia('(max-width: 767px), (prefers-reduced-motion: reduce)');\n    const update = () => setIsMobile(media.matches);\n    update();\n    media.addEventListener('change', update);\n    return () => media.removeEventListener('change', update);\n  }, []);\n\n  const rand = mulberry32(42);\n  const particles = Array.from({ length: isMobile ? 18 : 60 }, (_, i) => ({")
          replace('src/components/sections/HeroSection.tsx', 'className="relative min-h-screen flex flex-col justify-center overflow-hidden hero-perspective"', 'className="relative flex min-h-[100svh] flex-col justify-center overflow-hidden hero-perspective scroll-mt-24"')
          replace('src/components/sections/HeroSection.tsx', 'className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full pt-24 pb-16"', 'className="relative z-10 mx-auto w-full max-w-7xl px-4 pt-28 pb-16 sm:px-6 sm:pt-32 lg:px-8"')
          replace('src/components/sections/HeroSection.tsx', 'className="inline-flex items-center gap-4 text-gold/60 text-xs sm:text-sm tracking-ultra uppercase font-extralight font-cormorant"', 'className="inline-flex max-w-full items-center justify-center gap-3 text-center text-[10px] uppercase tracking-[0.18em] text-gold/60 font-extralight font-cormorant sm:gap-4 sm:text-sm sm:tracking-ultra"')
          replace('src/components/sections/HeroSection.tsx', 'className="font-serif-optical text-display-xl font-bold text-white"', 'className="font-serif-optical text-[clamp(2.8rem,14vw,7rem)] font-bold leading-[0.98] text-white sm:text-display-xl"')
          replace('src/components/sections/HeroSection.tsx', 'className="font-serif-optical text-display-xl font-bold hero-text-layer"', 'className="font-serif-optical text-[clamp(2.55rem,12vw,7rem)] font-bold leading-[1.02] hero-text-layer sm:text-display-xl"')
          replace('src/components/sections/HeroSection.tsx', "{char === ' ' ? '\\u00A0' : char}", "{char === ' ' ? ' ' : char}")
          replace('src/components/sections/HeroSection.tsx', 'className="font-cormorant text-body-lg text-white/50 max-w-2xl mx-auto leading-relaxed tracking-wide"', 'className="mx-auto max-w-2xl font-cormorant text-base leading-relaxed tracking-wide text-white/55 sm:text-body-lg"')
          replace('src/components/sections/HeroSection.tsx', 'className="mt-12 flex flex-col sm:flex-row gap-5 justify-center items-center"', 'className="mt-10 flex flex-col items-stretch justify-center gap-4 sm:mt-12 sm:flex-row sm:items-center sm:gap-5"')
          replace('src/components/sections/HeroSection.tsx', 'className="mt-24 sm:mt-28 max-w-4xl mx-auto"', 'className="mt-16 max-w-4xl mx-auto sm:mt-24 md:mt-28"')
          replace('src/components/sections/HeroSection.tsx', 'className="grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-8 perspective-1000"', 'className="grid grid-cols-2 gap-4 perspective-1000 sm:gap-6 md:grid-cols-4 md:gap-8"')
          replace('src/components/sections/HeroSection.tsx', "document.getElementById('about')?.scrollIntoView({ behavior: 'smooth' });", "const el = document.getElementById('about');\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 88;\n    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });")
          replace('src/components/sections/HeroSection.tsx', 'className="group relative inline-flex items-center gap-3 bg-gold text-charcoal-dark font-semibold px-8 py-4 rounded-sm transition-all duration-300 text-sm sm:text-base overflow-hidden"', 'className="group relative inline-flex items-center justify-center gap-3 overflow-hidden rounded-sm bg-gold px-6 py-3.5 text-sm font-semibold text-charcoal-dark transition-all duration-300 sm:px-8 sm:py-4 sm:text-base"')

          p = Path('src/app/page.tsx')
          s = p.read_text()
          s = s.replace("import { useState, useCallback } from 'react';\n", "")
          s = s.replace("import Preloader from '@/components/premium/Preloader';\n", "")
          s = s.replace("import OnboardingOverlay from '@/components/premium/OnboardingOverlay';\n", "")
          s = s.replace("  const [preloaderDone, setPreloaderDone] = useState(false);\n\n  const handlePreloaderComplete = useCallback(() => {\n    setPreloaderDone(true);\n  }, []);\n\n  return (\n    <>\n      {!preloaderDone && <Preloader onComplete={handlePreloaderComplete} />}\n\n      <SmoothScroll>", "  return (\n    <>\n      <SmoothScroll>")
          s = s.replace("        <PremiumCursor />\n        <OnboardingOverlay />", "        <PremiumCursor />")
          p.write_text(s)

          css = Path('src/app/globals.css')
          c = css.read_text()
          patch = r'''

/* ═══════════════════════════════════════════════════════════
   MOBILE STABILITY + PERFORMANCE PATCH
   Keeps the premium feel while removing horizontal overflow,
   fixed-header overlap and heavy touch-device scroll effects.
   ═══════════════════════════════════════════════════════════ */
@layer base {
  html {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    scroll-padding-top: 88px;
    -webkit-text-size-adjust: 100%;
  }

  body {
    width: 100%;
    max-width: 100%;
    overflow-x: clip;
    overscroll-behavior-y: none;
  }

  main,
  section,
  header,
  footer {
    max-width: 100%;
  }

  section[id] {
    scroll-margin-top: 88px;
  }

  img,
  video,
  canvas,
  svg {
    max-width: 100%;
  }
}

@media (max-width: 767px) {
  :root {
    --radius: 0.875rem;
  }

  .tracking-luxury {
    letter-spacing: 0.16em;
  }

  .tracking-ultra {
    letter-spacing: 0.18em;
  }

  .text-body-lg {
    font-size: 1rem;
    line-height: 1.65;
  }

  .film-grain::before,
  .pattern-grid-dots,
  .hero-mesh-animate::before {
    display: none;
  }

  .hero-mesh-animate,
  .breathing-glow,
  .progress-bar-glow,
  .animated-text-gradient {
    animation-duration: 14s;
  }

  .glass,
  .glass-light,
  .glass-card-3d,
  .nav-glass-3d {
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
  }

  .card-3d:hover,
  .glass-card-3d:hover,
  .gold-border-3d:hover,
  .elevated-float:hover,
  .hover-lift:hover,
  .nav-link-3d:hover,
  .logo-3d-hover:hover {
    transform: none !important;
  }

  .luxury-shadow {
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}
'''
          if 'MOBILE STABILITY + PERFORMANCE PATCH' not in c:
              css.write_text(c + patch)
          PY

      - name: Commit responsive fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mobile-layout-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix mobile layout and scroll performance"
          git push origin main
